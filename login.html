<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light">
  <title>Masuk | PinjamanKu</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💰</text></svg>">

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <script src="app.js"></script>

  <style>
    :root {
      color-scheme: light;
      --ink: #14213d;
      --muted: #64748b;
      --blue: #2459d3;
      --blue-dark: #1e47b0;
      --line: #dce5f2;
      --focus: rgba(37, 99, 235, .2);
    }

    * { box-sizing: border-box; }
    html { min-height: 100%; }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0;
      font-family: 'Inter', sans-serif;
      color: var(--ink);
      background:
        radial-gradient(ellipse at 12% 12%, rgba(191, 219, 254, .55), transparent 36%),
        radial-gradient(ellipse at 88% 88%, rgba(187, 247, 208, .34), transparent 32%),
        #f5f8fd;
      -webkit-font-smoothing: antialiased;
    }

    .login-shell {
      position: relative;
      isolation: isolate;
      width: 100%;
      max-width: 440px;
      overflow: hidden;
      border: 1px solid rgba(226, 232, 240, .9);
      border-radius: 28px;
      background: rgba(255, 255, 255, .96);
      box-shadow: 0 28px 80px -34px rgba(30, 64, 120, .28), 0 8px 24px -16px rgba(15, 23, 42, .16);
    }

    .brand-mark {
      display: grid;
      place-items: center;
      width: 58px;
      height: 58px;
      border: 1px solid #dbeafe;
      border-radius: 19px;
      color: #2459d3;
      background: linear-gradient(145deg, #eff6ff, #dbeafe);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.9), 0 8px 18px -12px rgba(37, 99, 235, .7);
    }

    .field-input {
      width: 100%;
      height: 48px;
      padding: 0 16px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: #f8fafc;
      font-size: 14px;
      font-weight: 500;
      color: var(--ink);
      transition: all .2s ease;
      outline: none;
    }

    .field-input:focus {
      background: #fff;
      border-color: var(--blue);
      box-shadow: 0 0 0 4px var(--focus);
    }
  </style>
</head>

<body class="flex items-center justify-center p-4">
  <div class="login-shell p-7 sm:p-9">
    <div class="flex items-center gap-4 mb-6">
      <div class="brand-mark text-2xl">
        <i class="ph-fill ph-wallet"></i>
      </div>
      <div>
        <span class="text-xs font-bold uppercase tracking-wider text-blue-600">Sistem Keuangan</span>
        <h1 class="text-2xl font-extrabold text-slate-800">PinjamanKu</h1>
      </div>
    </div>

    <p class="text-sm text-slate-500 mb-6">
      Selamat datang! Masuk dengan akun kamu untuk mengelola catatan pinjaman & money tracker.
    </p>

    <!-- Alert Box -->
    <div id="loginAlert" class="hidden mb-5 p-3.5 rounded-xl text-xs font-semibold flex items-center gap-2"></div>

    <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4">
      <div>
        <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">Username</label>
        <div class="relative">
          <input type="text" id="username" required autocomplete="username" placeholder="Masukkan username"
            class="field-input pl-11">
          <i class="ph-bold ph-user absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 text-lg"></i>
        </div>
      </div>

      <div>
        <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">Password</label>
        <div class="relative">
          <input type="password" id="password" required autocomplete="current-password" placeholder="••••••••"
            class="field-input pl-11 pr-11">
          <i class="ph-bold ph-lock-key absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 text-lg"></i>
          <button type="button" onclick="togglePasswordVisibility()"
            class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600">
            <i id="eyeIcon" class="ph-bold ph-eye"></i>
          </button>
        </div>
      </div>

      <button type="submit" id="btnSubmit"
        class="w-full mt-2 h-12 bg-blue-600 hover:bg-blue-700 text-white font-bold text-sm rounded-xl shadow-lg shadow-blue-500/25 transition-all flex items-center justify-center gap-2">
        <span>Masuk ke Dashboard</span>
        <i class="ph-bold ph-arrow-right"></i>
      </button>
    </form>

    <div class="mt-8 pt-6 border-t border-slate-100 flex items-center justify-between text-xs text-slate-500">
      <div class="flex items-center gap-1.5">
        <span class="w-2 h-2 rounded-full bg-emerald-500"></span>
        <span>Koneksi Aman Terenkripsi</span>
      </div>
      <span class="text-[11px] text-slate-400">v2.0 &bull; Secure Session</span>
    </div>
  </div>

  <script>
    // Cek sesi login
    const auth = AppStorage.getAuth();
    if (auth && auth.isLoggedIn && auth.token) {
      window.location.replace('dashboard.html');
    }

    function togglePasswordVisibility() {
      const pwd = document.getElementById('password');
      const icon = document.getElementById('eyeIcon');
      if (pwd.type === 'password') {
        pwd.type = 'text';
        icon.className = 'ph-bold ph-eye-slash';
      } else {
        pwd.type = 'password';
        icon.className = 'ph-bold ph-eye';
      }
    }

    async function handleLogin(e) {
      e.preventDefault();
      const btn = document.getElementById('btnSubmit');
      const alertBox = document.getElementById('loginAlert');
      const user = document.getElementById('username').value.trim();
      const pass = document.getElementById('password').value;

      btn.disabled = true;
      btn.innerHTML = '<i class="ph ph-spinner-gap animate-spin"></i> Memverifikasi kredensial...';
      alertBox.classList.add('hidden');

      try {
        // Otentikasi langsung ke server Google Apps Script (bebas hardcode password di GitHub)
        const res = await PinjamanAPI.login(user, pass);

        if (res && res.success && res.token) {
          AppStorage.setAuth({
            isLoggedIn: true,
            username: user,
            name: res.name || 'Nunu Anugraha',
            token: res.token,
            loginTime: new Date().toISOString()
          });

          alertBox.className = 'mb-5 p-3.5 rounded-xl text-xs font-semibold flex items-center gap-2 bg-emerald-50 text-emerald-700 border border-emerald-100';
          alertBox.innerHTML = '<i class="ph-fill ph-check-circle text-lg"></i> Berhasil masuk! Mengalihkan ke dashboard...';
          alertBox.classList.remove('hidden');

          setTimeout(() => {
            window.location.replace('dashboard.html');
          }, 600);
        } else {
          alertBox.className = 'mb-5 p-3.5 rounded-xl text-xs font-semibold flex items-center gap-2 bg-rose-50 text-rose-700 border border-rose-100';
          alertBox.innerHTML = `<i class="ph-fill ph-x-circle text-lg"></i> ${res.message || 'Username atau password salah!'}`;
          alertBox.classList.remove('hidden');
          btn.disabled = false;
          btn.innerHTML = '<span>Masuk ke Dashboard</span><i class="ph-bold ph-arrow-right"></i>';
        }
      } catch (err) {
        alertBox.className = 'mb-5 p-3.5 rounded-xl text-xs font-semibold flex items-center gap-2 bg-rose-50 text-rose-700 border border-rose-100';
        alertBox.innerHTML = '<i class="ph-fill ph-warning text-lg"></i> Gagal menghubungi server verifikasi. Periksa koneksi internet Anda.';
        alertBox.classList.remove('hidden');
        btn.disabled = false;
        btn.innerHTML = '<span>Masuk ke Dashboard</span><i class="ph-bold ph-arrow-right"></i>';
      }
    }
  </script>
</body>
</html>
