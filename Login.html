<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light">
  <title>Masuk | PinjamanKu</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/@phosphor-icons/web"></script>

  <style>
    :root {
      color-scheme: light;
      --ink: #14213d;
      --muted: #64748b;
      --blue: #2459d3;
      --blue-dark: #1e47b0;
      --line: #dce5f2;
      --focus: rgba(37, 99, 235, .2);
    }

    * { box-sizing: border-box; }

    html { min-height: 100%; }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0;
      font-family: 'Inter', sans-serif;
      color: var(--ink);
      background:
        radial-gradient(ellipse at 12% 12%, rgba(191, 219, 254, .55), transparent 36%),
        radial-gradient(ellipse at 88% 88%, rgba(187, 247, 208, .34), transparent 32%),
        #f5f8fd;
      -webkit-font-smoothing: antialiased;
    }

    .login-shell {
      position: relative;
      isolation: isolate;
      width: 100%;
      max-width: 448px;
      overflow: hidden;
      border: 1px solid rgba(226, 232, 240, .9);
      border-radius: 28px;
      background: rgba(255, 255, 255, .94);
      box-shadow: 0 28px 80px -34px rgba(30, 64, 120, .28), 0 8px 24px -16px rgba(15, 23, 42, .16);
    }

    .login-topline {
      height: 5px;
      background: linear-gradient(90deg, #1d4ed8, #60a5fa 58%, #34d399);
    }

    .brand-mark {
      display: grid;
      place-items: center;
      width: 58px;
      height: 58px;
      border: 1px solid #dbeafe;
      border-radius: 19px;
      color: #2459d3;
      background: linear-gradient(145deg, #eff6ff, #dbeafe);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.9), 0 8px 18px -12px rgba(37, 99, 235, .7);
    }

    .field-label {
      display: block;
      margin-bottom: 9px;
      color: #334155;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: -.01em;
    }

    .field-wrap { position: relative; }

    .field-icon {
      position: absolute;
      top: 50%;
      left: 15px;
      transform: translateY(-50%);
      color: #64748b;
      font-size: 20px;
      pointer-events: none;
    }

    .login-input {
      display: block;
      width: 100%;
      min-height: 52px;
      padding: 13px 46px 13px 46px;
      border: 1px solid var(--line);
      border-radius: 14px;
      outline: none;
      color: #0f172a;
      background: #f8fafc;
      font: inherit;
      font-size: 14px;
      transition: border-color .18s ease, background-color .18s ease, box-shadow .18s ease;
    }

    .login-input::placeholder { color: #94a3b8; }

    .login-input:hover { border-color: #c4d2e5; }

    .login-input:focus {
      border-color: #4f83ee;
      background: #fff;
      box-shadow: 0 0 0 4px var(--focus);
    }

    .password-toggle {
      position: absolute;
      top: 50%;
      right: 7px;
      display: grid;
      place-items: center;
      width: 40px;
      height: 40px;
      transform: translateY(-50%);
      border: 0;
      border-radius: 11px;
      color: #64748b;
      background: transparent;
      cursor: pointer;
      transition: color .18s ease, background-color .18s ease;
    }

    .password-toggle:hover { color: #1d4ed8; background: #eff6ff; }

    .primary-button {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      min-height: 52px;
      margin-top: 26px;
      padding: 13px 18px;
      border: 1px solid #1e47b0;
      border-radius: 14px;
      color: #fff;
      background: linear-gradient(135deg, #2d65e0, #214fc2);
      box-shadow: 0 10px 22px -12px rgba(37, 99, 235, .8);
      font: inherit;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: transform .18s ease, box-shadow .18s ease, background .18s ease;
    }

    .primary-button:hover:not(:disabled) {
      transform: translateY(-1px);
      background: linear-gradient(135deg, #2459d3, #193f9f);
      box-shadow: 0 14px 26px -13px rgba(37, 99, 235, .9);
    }

    .primary-button:active:not(:disabled) { transform: translateY(0); }

    .primary-button:disabled {
      cursor: wait;
      opacity: .78;
      box-shadow: none;
    }

    button:focus-visible {
      outline: 3px solid #1d4ed8;
      outline-offset: 3px;
    }

    .alert-box {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 13px 14px;
      border: 1px solid #fecdd3;
      border-radius: 14px;
      color: #9f1239;
      background: #fff1f2;
      font-size: 13px;
      line-height: 1.5;
    }

    .alert-box[hidden] { display: none; }

    .security-note {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      color: #64748b;
      font-size: 11px;
      line-height: 1.5;
      text-align: center;
    }

    @media (max-width: 480px) {
      body { padding: 18px !important; }
      .login-shell { border-radius: 23px; }
      .login-content { padding: 27px 23px 24px !important; }
      .login-heading { font-size: 25px !important; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>

<body class="flex items-center justify-center p-6">
  <main class="login-shell">
    <div class="login-topline" aria-hidden="true"></div>

    <div class="login-content relative z-10 p-10">
      <header class="mb-8 text-center">
        <div class="brand-mark mx-auto mb-5" aria-hidden="true">
          <i class="ph-fill ph-wallet text-3xl"></i>
        </div>
        <p class="mb-2 text-xs font-bold uppercase tracking-[.18em] text-blue-700">PinjamanKu</p>
        <h1 class="login-heading text-[28px] font-extrabold tracking-tight text-slate-900">Selamat datang kembali</h1>
        <p class="mt-2 text-sm leading-6 text-slate-600">Masuk ke akun Anda untuk melanjutkan.</p>
      </header>

      <div id="loginAlert" class="alert-box mb-5" role="alert" aria-live="polite" hidden>
        <i class="ph-fill ph-warning-circle mt-0.5 shrink-0 text-xl" aria-hidden="true"></i>
        <p id="loginAlertText"></p>
      </div>

      <form id="formLogin" onsubmit="initSubmitLogin(event)">
        <div class="space-y-5">
          <div>
            <label for="inputUsername" class="field-label">Nama pengguna</label>
            <div class="field-wrap">
              <i class="field-icon ph ph-user" aria-hidden="true"></i>
              <input
                type="text"
                id="inputUsername"
                name="username"
                autocomplete="username"
                autocapitalize="none"
                spellcheck="false"
                required
                placeholder="Masukkan nama pengguna"
                class="login-input"
              >
            </div>
          </div>

          <div>
            <label for="inputPassword" class="field-label">Kata sandi</label>
            <div class="field-wrap">
              <i class="field-icon ph ph-lock-key" aria-hidden="true"></i>
              <input
                type="password"
                id="inputPassword"
                name="password"
                autocomplete="current-password"
                required
                placeholder="Masukkan kata sandi"
                class="login-input"
              >
              <button
                type="button"
                onclick="initTogglePassword()"
                aria-label="Tampilkan kata sandi"
                aria-controls="inputPassword"
                aria-pressed="false"
                id="btnTogglePassword"
                class="password-toggle"
              >
                <i class="ph ph-eye text-xl" id="iconTogglePassword" aria-hidden="true"></i>
              </button>
            </div>
          </div>
        </div>

        <button type="submit" id="btnLogin" class="primary-button">
          <span id="btnLoginContent">Masuk ke akun</span>
          <i class="ph ph-arrow-right text-lg" id="btnLoginIcon" aria-hidden="true"></i>
        </button>
      </form>

      <footer class="mt-7 border-t border-slate-100 pt-5">
        <p class="security-note">
          <i class="ph ph-shield-check text-base text-emerald-600" aria-hidden="true"></i>
          Gunakan akun Anda sendiri dan jangan bagikan kata sandi.
        </p>
      </footer>
    </div>
  </main>

  <script>
    function initTogglePassword() {
      const input = document.getElementById('inputPassword');
      const icon = document.getElementById('iconTogglePassword');
      const btn = document.getElementById('btnTogglePassword');
      const show = input.type === 'password';

      input.type = show ? 'text' : 'password';
      icon.classList.toggle('ph-eye', !show);
      icon.classList.toggle('ph-eye-slash', show);
      btn.setAttribute('aria-label', show ? 'Sembunyikan kata sandi' : 'Tampilkan kata sandi');
      btn.setAttribute('aria-pressed', String(show));
    }

    function initShowLoginError(message) {
      const alert = document.getElementById('loginAlert');
      document.getElementById('loginAlertText').textContent =
        message || 'Login belum berhasil. Periksa kembali data Anda.';
      alert.hidden = false;
    }

    function initHideLoginError() {
      const alert = document.getElementById('loginAlert');
      alert.hidden = true;
      document.getElementById('loginAlertText').textContent = '';
    }

    function initSubmitLogin(e) {
      e.preventDefault();
      initHideLoginError();

      const btn = document.getElementById('btnLogin');
      const content = document.getElementById('btnLoginContent');
      const icon = document.getElementById('btnLoginIcon');
      const username = document.getElementById('inputUsername').value.trim();
      const password = document.getElementById('inputPassword').value;
      const originalLabel = content.textContent;
      const originalIconClass = icon.className;

      btn.disabled = true;
      btn.setAttribute('aria-busy', 'true');
      content.textContent = 'Memverifikasi...';
      icon.className = 'ph ph-spinner-gap animate-spin text-lg';
      document.getElementById('inputUsername').setAttribute('aria-invalid', 'false');
      document.getElementById('inputPassword').setAttribute('aria-invalid', 'false');

      let completed = false;
      const resetButton = () => {
        if (completed) return;
        completed = true;
        btn.disabled = false;
        btn.removeAttribute('aria-busy');
        content.textContent = originalLabel;
        icon.className = originalIconClass;
      };

      if (!window.google || !google.script || !google.script.run) {
        initShowLoginError('Layanan login tidak tersedia. Buka halaman ini melalui aplikasi PinjamanKu yang resmi.');
        resetButton();
        return;
      }

      google.script.run
        .withSuccessHandler(function(response) {
          if (!response || response.success !== true) {
            initShowLoginError(response && response.message
              ? response.message
              : 'Nama pengguna atau kata sandi tidak sesuai.');
            resetButton();
            return;
          }

          if (response.redirectUrl) {
            window.top.location.href = response.redirectUrl;
          } else {
            initShowLoginError('Login berhasil, tetapi alamat tujuan belum tersedia. Hubungi administrator.');
            resetButton();
          }
        })
        .withFailureHandler(function() {
          initShowLoginError('Tidak bisa terhubung ke server. Periksa koneksi Anda lalu coba lagi.');
          resetButton();
        })
        .verifikasiLogin(username, password);
    }
  </script>
</body>
</html>
