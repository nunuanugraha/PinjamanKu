  <script>
    // --- STATE GLOBAL & UTILITIES ---
window.allTrackerData = [];
let confirmCallback = null;

function initNavToCalculator() { window.top.location.href = BASE_APP_URL + "?page=kalkulator&session=" + encodeURIComponent(AUTH_TOKEN); }
    function initNavToDashboard() { window.top.location.href = BASE_APP_URL + "?page=dashboard&session=" + encodeURIComponent(AUTH_TOKEN); }
function initModalOpen(id) { document.getElementById(id).classList.remove('hidden'); }
function initModalClose(id) { document.getElementById(id).classList.add('hidden'); }

function initFormatInputRibuan(element) {
  let value = element.value.replace(/[^0-9]/g, '');
  if (value !== '') {
    value = parseInt(value, 10).toString();
    element.value = value.replace(/\B(?=(\d{3})+(?!\d))/g, ".");
  } else {
    element.value = '';
  }
}

function escapeTrackerHtml(value) {
  return String(value == null ? '' : value).replace(/[&<>"']/g, function(char) {
    return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[char];
  });
}

function formatRupiah(number) {
  return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(number);
}

function formatDate(dateString) {
  if (!dateString) return '-';
  const d = new Date(dateString);
  return new Intl.DateTimeFormat('id-ID', { day: 'numeric', month: 'short', year: 'numeric' }).format(d);
}

// --- UI/UX CUSTOM ALERTS & CONFIRMS ---
function initShowAlert(message, type = 'success') {
  const modal = document.getElementById('modalAlert');
  const icon = document.getElementById('alertIcon');
  const title = document.getElementById('alertTitle');
  
  if (type === 'success') {
    icon.className = 'mx-auto w-16 h-16 mb-5 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center text-3xl shadow-inner border border-white';
    icon.innerHTML = '<i class="ph-fill ph-check-circle"></i>';
    title.innerText = 'Berhasil';
  } else if (type === 'error') {
    icon.className = 'mx-auto w-16 h-16 mb-5 bg-rose-100 text-rose-600 rounded-full flex items-center justify-center text-3xl shadow-inner border border-white';
    icon.innerHTML = '<i class="ph-fill ph-x-circle"></i>';
    title.innerText = 'Terjadi Kesalahan';
  }
  
  document.getElementById('alertMessage').innerText = message;
  modal.classList.remove('hidden');
}

function initCloseAlert() { document.getElementById('modalAlert').classList.add('hidden'); }

function initShowConfirm(message, callback) {
  document.getElementById('confirmMessage').innerText = message;
  confirmCallback = callback;
  document.getElementById('modalConfirm').classList.remove('hidden');
  
  document.getElementById('btnConfirmAction').onclick = function() {
    const executeAction = confirmCallback; 
    initCloseConfirm(); 
    if (typeof executeAction === 'function') executeAction(); 
  };
}

function initCloseConfirm() {
  document.getElementById('modalConfirm').classList.add('hidden');
  confirmCallback = null;
}

// --- DATA HANDLING (READ & CREATE) ---
function initLoadTrackerData() {
  document.getElementById('inputTanggal').value = new Date().toISOString().split('T')[0];
  const tbody = document.getElementById('tableTracker');
  tbody.innerHTML = `<tr><td colspan="5" class="text-center py-10 text-slate-400 font-medium"><i class="ph ph-spinner-gap animate-spin inline-block mr-2"></i> Memuat data...</td></tr>`;
  
  google.script.run
    .withSuccessHandler(initRenderTracker)
    .withFailureHandler((err) => {
      tbody.innerHTML = `<tr><td colspan="5" class="text-center py-6 text-rose-600">Error: ${escapeTrackerHtml(err && err.message ? err.message : 'Gagal memuat data.')}</td></tr>`;
    })
    .getTrackerData();
}

function initRenderTracker(data) {
  window.allTrackerData = data || [];
  let totalPemasukan = 0;
  let totalPengeluaran = 0;
  const tbody = document.getElementById('tableTracker');
  tbody.innerHTML = '';

  if (window.allTrackerData.length === 0) {
    tbody.innerHTML = `<tr><td colspan="5" class="text-center py-12 text-slate-400 font-medium">Belum ada aktivitas.</td></tr>`;
    document.getElementById('dashPemasukan').innerText = formatRupiah(0);
    document.getElementById('dashPengeluaran').innerText = formatRupiah(0);
    document.getElementById('dashSaldo').innerText = formatRupiah(0);
    return;
  }

  window.allTrackerData.forEach(item => {
    const nominal = Number(item.nominal);
    const isPemasukan = item.tipe === 'Pemasukan';
    
    if (isPemasukan) totalPemasukan += nominal;
    else totalPengeluaran += nominal;

    const tr = document.createElement('tr');
    tr.className = 'hover:bg-slate-50/50 transition-colors group cursor-default';
    tr.innerHTML = `
      <td class="px-8 py-5 text-slate-600 font-medium">${formatDate(item.tanggal)}</td>
      <td class="px-6 py-5"><span class="bg-slate-100 text-slate-600 px-3 py-1 rounded-full text-xs font-bold">${escapeTrackerHtml(item.kategori)}</span></td>
      <td class="px-6 py-5 text-slate-600 whitespace-normal min-w-[200px]">${escapeTrackerHtml(item.catatan || '-')}</td>
      <td class="px-8 py-5 text-right font-bold ${isPemasukan ? 'text-emerald-600' : 'text-slate-800'}">
        ${isPemasukan ? '+' : '-'}${formatRupiah(nominal)}
      </td>
      <td class="px-8 py-5">
        <div class="flex justify-center gap-2 opacity-100 md:opacity-0 md:group-hover:opacity-100 transition-opacity">
          <button onclick="initEditTrackerOpen('${item.id}')" class="bubble-btn bg-amber-50 text-amber-600 hover:bg-amber-100 hover:text-amber-700 font-bold px-2.5 py-1.5 transition-colors" title="Ubah Data"><i class="ph-fill ph-pencil-simple text-base"></i></button>
          <button onclick="initDeleteTrackerConfirm('${item.id}')" class="bubble-btn bg-rose-50 text-rose-600 hover:bg-rose-100 hover:text-rose-700 font-bold px-2.5 py-1.5 transition-colors" title="Hapus"><i class="ph-fill ph-trash text-base"></i></button>
        </div>
      </td>
    `;
    tbody.appendChild(tr);
  });

  document.getElementById('dashPemasukan').innerText = formatRupiah(totalPemasukan);
  document.getElementById('dashPengeluaran').innerText = formatRupiah(totalPengeluaran);
  document.getElementById('dashSaldo').innerText = formatRupiah(totalPemasukan - totalPengeluaran);
}

function initSubmitTracker(e) {
  e.preventDefault();
  const btn = document.getElementById('btnSubmitTracker');
  const originalText = btn.innerHTML;
  btn.innerHTML = '<i class="ph ph-spinner-gap animate-spin"></i> Menyimpan...';
  btn.disabled = true;

  const formData = {
    tipe: document.getElementById('inputTipe').value,
    tanggal: document.getElementById('inputTanggal').value,
    nominal: document.getElementById('inputNominal').value,
    kategori: document.getElementById('inputKategori').value,
    catatan: document.getElementById('inputCatatan').value
  };

  google.script.run
    .withSuccessHandler((res) => {
      initShowAlert(res.message, 'success');
      document.getElementById('formTracker').reset();
      initModalClose('modalTransaksi');
      btn.innerHTML = originalText;
      btn.disabled = false;
      initLoadTrackerData(); 
    })
    .withFailureHandler((err) => {
      initShowAlert('Terjadi kesalahan: ' + err.message, 'error');
      btn.innerHTML = originalText;
      btn.disabled = false;
    })
    .tambahTransaksiTracker(formData);
}

// --- DATA HANDLING (UPDATE & DELETE) ---
function initEditTrackerOpen(id) {
  const targetId = String(id).trim();
  const item = window.allTrackerData.find(p => String(p.id).trim() === targetId);
  
  if (!item) {
    initShowAlert('Data tidak ditemukan.', 'error');
    return;
  }

  document.getElementById('editTrackerId').value = targetId;
  document.getElementById('editTrackerTipe').value = item.tipe;
  document.getElementById('editTrackerTanggal').value = item.tanggal;
  document.getElementById('editTrackerKategori').value = item.kategori;
  document.getElementById('editTrackerCatatan').value = item.catatan || '';
  
  const inputNominal = document.getElementById('editTrackerNominal');
  inputNominal.value = item.nominal;
  initFormatInputRibuan(inputNominal); 
  
  initModalOpen('modalEditTracker');
}

function initSubmitEditTracker(e) {
  e.preventDefault();
  const btn = document.getElementById('btnSubmitEditTracker');
  const originalText = btn.innerHTML;
  btn.innerHTML = '<i class="ph ph-spinner-gap animate-spin"></i> Menyimpan...';
  btn.disabled = true;

  const formData = {
    id: document.getElementById('editTrackerId').value,
    tipe: document.getElementById('editTrackerTipe').value,
    tanggal: document.getElementById('editTrackerTanggal').value,
    nominal: document.getElementById('editTrackerNominal').value.replace(/\./g, ''),
    kategori: document.getElementById('editTrackerKategori').value,
    catatan: document.getElementById('editTrackerCatatan').value
  };

  google.script.run
    .withSuccessHandler((res) => {
      initShowAlert(res.message, 'success');
      initModalClose('modalEditTracker');
      btn.innerHTML = originalText;
      btn.disabled = false;
      initLoadTrackerData();
    })
    .withFailureHandler((err) => {
      initShowAlert('Terjadi kesalahan: ' + err.message, 'error');
      btn.innerHTML = originalText;
      btn.disabled = false;
    })
    .editTransaksiTracker(formData);
}

function initDeleteTrackerConfirm(id) {
  const targetId = String(id).trim();
  const item = window.allTrackerData.find(p => String(p.id).trim() === targetId);
  
  if (!item) {
    initShowAlert('Sistem gagal menemukan ID data.', 'error');
    return;
  }
  
  initShowConfirm(
    `Apakah Anda yakin ingin menghapus transaksi "${item.kategori}" sebesar ${formatRupiah(item.nominal)}?`,
    function() {
      google.script.run
        .withSuccessHandler((res) => {
          initShowAlert(res.message, 'success');
          initLoadTrackerData(); 
        })
        .withFailureHandler((err) => {
          initShowAlert('Gagal Hapus: ' + err.message, 'error');
        })
        .hapusTransaksiTracker(targetId);
    }
  );
}

// Eksekusi Inisialisasi Murni
function initTrackerApp() {
  initLoadTrackerData();
}
window.onload = initTrackerApp;
  </script>
</body>
